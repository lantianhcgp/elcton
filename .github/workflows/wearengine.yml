name: wearengine-watch
on:
  push:
    branches: [feat/wearengine-sync, fix/preserve-watch-design]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout the fixed simulator QA dependency
        uses: actions/checkout@v4
        with:
          repository: kqakqakqa/hmlwsim
          ref: 2b28919fc14ea25eaed46f895817d58e481a8657
          path: .qa-hmlwsim
          persist-credentials: false
      - name: Apply disclosed simulator compatibility patches
        run: |
          git -C .qa-hmlwsim apply --check "$GITHUB_WORKSPACE/qa/hmlwsim-compat.patch"
          git -C .qa-hmlwsim apply "$GITHUB_WORKSPACE/qa/hmlwsim-compat.patch"
      - name: Protocol and persistence regression tests
        env:
          HMLWSIM_ROOT: ./.qa-hmlwsim
        run: |
          npm ci --prefix tools/sign --no-audit --no-fund
          node --experimental-default-type=module --test tests/*.test.mjs
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev
      - uses: ErBWs/setup-ohos@v2
        with:
          version: 6.1.1.280
          cache: true
      - name: Toolchain paths
        shell: bash
        run: |
          for p in "$HOME/ohos-sdk/command-line-tools/bin" "$HOME/ohos-sdk/command-line-tools/tool/node/bin"; do
            if [ -d "$p" ]; then printf '%s\n' "$p" >> "$GITHUB_PATH"; fi
          done
          if [ -d "$HOME/ohos-sdk/command-line-tools/sdk" ]; then printf 'HOS_SDK_HOME=%s\n' "$HOME/ohos-sdk/command-line-tools/sdk" >> "$GITHUB_ENV"; fi
      - name: Build actual Lite package
        run: |
          ohpm install --all
          hvigorw assembleApp --mode project -p product=default -p buildMode=debug --no-daemon --accept-license
          python3 scripts/clean_config_in_app.py build/outputs/default/*.app
          npm ci --prefix tools/sign --no-audit --no-fund
          node qa/compaction_test.mjs
          node scripts/compact_lite_app.mjs build/outputs/default/*.app
          python3 scripts/verify_wear_bundle.py build/outputs/default/*.app
      - name: Sign and verify course application identity
        env:
          SIGN_P12_PEM: ${{ secrets.SIGN_P12_PEM_ELCTON }}
        run: |
          test -n "$SIGN_P12_PEM"
          mkdir -p dist
          npm ci --prefix tools/sign --no-audit --no-fund
          FORCE_P7B_BUNDLE=1 node tools/sign/sign-app-to-hap.js build/outputs/default/*.app certs/elcton.p7b dist/elcton-wearengine-probe.hap
          python3 tools/sign/verify_sign.py dist/elcton-wearengine-probe.hap certs/elcton.p7b
          cp build/outputs/default/*.app dist/
          printf '%s\n' "$GITHUB_SHA" > dist/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wearengine-watch-${{ github.sha }}
          path: dist/
          if-no-files-found: error
